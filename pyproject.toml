# ============================================================
# Agent Vulnerability Assessment Platform - 项目配置文件
# 支持：pip install -e . 安装开发环境，ruff / black / mypy 代码质量检查
# ============================================================
[project]
name = "assessment-vuln-platform"
version = "2.4.0"
description = "基于 AgentBench + OpenClaw 的 AI Agent 高危漏洞自动化评估平台"
requires-python = ">=3.9"
authors = [
    { name = "hrgt698", email = "1810848755@qq.com" },
]
license = { text = "MIT" }
readme = "README.md"

dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.22",
    "requests>=2.28",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.8",
    "bandit>=1.7",
    "safety>=3.0",
    "pip-audit>=2.6",
    "httpx>=0.27",
]
vector = [
    "faiss-cpu>=1.7",
]


# ============================================================
# 构建系统
# ============================================================
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# ============================================================
# 源码打包配置
# ============================================================
[tool.setuptools.packages.find]
where = ["."]
include = ["backend", "agentbench_core"]
exclude = ["tests", "tests/*", "frontend", "frontend/*"]

# ============================================================
# ruff: 快速 Python 代码检查工具（替代 flake8 + isort）
# 运行方式：ruff check backend/
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# 启用规则集
select = [
    "E",     # pycodestyle 错误
    "F",     # pyflakes 未定义/未使用
    "W",     # pycodestyle 警告
    "I",     # isort import 排序
    "N",     # pep8-naming 命名规范
    "UP",    # pyupgrade 现代化语法
    "B",     # flake8-bugbear bug 检测
    "SIM",   # flake8-simplify 简化建议
    "T20",   # flake8-print 禁止 print
    "T10",   # flake8-debugger 禁止断点
    "TCH",   # typing import
    "C4",    # flake8-comprehensions 列表推导优化
    "PERF",  # flake8-performance 性能建议
    "RUF",   # ruff 特有规则
]

# 忽略规则
ignore = [
    "E501",  # line too long（由 black 处理）
    "T201",  # print 允许（项目中打印有用）
    "B008",  # 允许在函数默认值中使用可变对象（项目需要）
]

# 允许的未使用变量名（忽略以下划线开头的变量）
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "T201"]
"backend/exp_*.py" = ["E501", "T201", "S602", "S605"]  # 漏洞脚本：允许 shell=True（教学用途）

# ============================================================
# black: Python 代码格式化
# 运行方式：black backend/
# ============================================================
[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'

# ============================================================
# mypy: 静态类型检查
# 运行方式：mypy backend/
# ============================================================
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ============================================================
# pytest: 测试配置
# 运行方式：pytest backend/tests/
# ============================================================
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"

# ============================================================
# pytest-cov: 测试覆盖率
# ============================================================
[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/tests/*",
    "backend/exp_*.py",
    "agentbench_core/*",
    "backend/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
]
fail_under = 60
show_missing = true
skip_covered = false

# ============================================================
# bandit: 安全漏洞静态扫描
# 运行方式：bandit -r backend/
# ============================================================
[tool.bandit]
exclude_dirs = ["tests", "frontend", "agentbench_core"]

[tool.bandit.main]
severity = ["low", "medium", "high"]
confidence = ["low", "medium", "high"]
recursive = true
verbose = true
