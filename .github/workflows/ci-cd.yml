name: Backend CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ===== Stage 1: Lint =====
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -q ruff black mypy

      - name: Run ruff (lint + import sort)
        run: |
          ruff check backend/ --output-format=github

      - name: Run black (format check)
        run: |
          black --check backend/

      - name: Run mypy (type check)
        run: |
          mypy backend/ --ignore-missing-imports

  # ===== Stage 2: Test =====
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -q -r backend/requirements.txt

      - name: Run pytest
        run: |
          python -m pytest backend/tests/ -v --tb=short --cov=backend --cov-report=html --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/

  # ===== Stage 3: Security Scan =====
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -q bandit safety pip-audit

      - name: Run Bandit (static security analysis)
        run: |
          bandit -r backend/ -f json --output=bandit-results.json

      - name: Upload Bandit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-results
          path: bandit-results.json

      - name: Run Safety (dependency vulnerability scan)
        run: |
          safety check --json --output=safety-results.json

      - name: Upload Safety results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-results
          path: safety-results.json

      - name: Run pip-audit (PyPI vulnerability audit)
        run: |
          pip-audit --output=pip-audit-results.json

      - name: Upload pip-audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-results
          path: pip-audit-results.json

  # ===== Stage 3.5: Frontend Lint =====
  frontend-lint:
    name: Frontend ESLint Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint
        continue-on-error: true

  # ===== Stage 3.6: DAST (OWASP ZAP Baseline) =====
  security-dast:
    name: 动态应用安全测试（OWASP ZAP Baseline）
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Pull OWASP ZAP Docker Image
        run: docker pull ghcr.io/zaproxy/zaproxy:stable

      - name: Start Backend for Testing
        run: |
          # 注意：DAST 需要运行中的靶机实例，当前为占位步骤
          # 完整的 DAST 扫描需要后端 + 靶机同时在线
          echo "Note: DAST 扫描需要运行中的后端实例，当前仓库使用本地靶机配置"

      - name: ZAP Baseline Scan
        run: |
          # docker run -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://localhost:8000 -r zap-report.html -I || true
          echo "ZAP baseline scan skipped in CI - requires running backend"
        continue-on-error: true

  # ===== Stage 4: Docker Build =====
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build target Docker image
        run: |
          cd backend
          docker build -f Dockerfile.target -t assessment-target:${{ github.sha }} .

      - name: Build backend Docker image
        run: |
          cd backend
          docker build -t assessment-backend:${{ github.sha }} .

      - name: Build frontend Docker image
        run: |
          cd frontend
          docker build -t assessment-frontend:${{ github.sha }} .

      - name: Run container smoke test
        run: |
          docker run -d --name test-target -p 18789:18789 assessment-target:${{ github.sha }}
          sleep 5
          docker run -d --name test-backend --link test-target -p 8000:8000 assessment-backend:${{ github.sha }}
          sleep 5
          # Basic health check
          docker logs test-backend || true
          docker logs test-target || true
          docker stop test-backend test-target || true
          docker rm test-backend test-target || true
